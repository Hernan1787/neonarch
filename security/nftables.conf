#!/usr/bin/nft -f
# NeonArch — Topic 9: host firewall, default-deny for incoming traffic
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop comment "drop malformed / out-of-state packets"
        ct state { established, related } accept comment "replies to our own connections"
        iifname "lo" accept comment "loopback"
        meta l4proto { icmp, ipv6-icmp } limit rate 10/second accept comment "ping, rate-limited"
        tcp dport 22 ct state new limit rate 6/minute accept comment "SSH, brute-force rate limit"
        counter log prefix "nft-drop: " level info comment "count and log what we drop"
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
