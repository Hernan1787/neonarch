# NeonArch — Topic 2: VM tuning recommended when the main swap is zram (Arch Wiki: zram)
# Swapping to zram is cheap (RAM + CPU), so prefer it over dropping the page cache.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# Read one page at a time from swap (no read-ahead: zram has no seek cost)
vm.page-cluster = 0
