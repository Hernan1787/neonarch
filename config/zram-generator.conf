# NeonArch — Topic 2: compressed swap in RAM (zram), created at boot by zram-generator.
# zram-size: up to 50 % of RAM of *uncompressed* data.
# compression-algorithm: zstd (good ratio, fast enough for 2 vCPUs).
# swap-priority 100: used BEFORE the disk swapfile (priority 10).
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
